smart_url:
  name: Smart play URL
  description: RelayTV one-button URL handling via POST /smart. If RelayTV is already playing, the URL is enqueued; otherwise it starts immediate playback. Finite YouTube playlists are automatically imported when playlist_mode is auto or playlist.
  target:
    entity:
      domain: media_player
      integration: relaytv
  fields:
    url:
      required: true
      example: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
      selector:
        text:
    use_ytdlp:
      required: false
      default: true
      selector:
        boolean:
    cec:
      required: false
      default: false
      selector:
        boolean:
    playlist_mode:
      required: false
      default: auto
      selector:
        select:
          options:
            - auto
            - video
            - playlist

play_now:
  name: Play now
  description: Play a URL immediately. Defaults to RelayTV POST /play (clears queue), or uses POST /play_now when preserve/playlist options are specified.
  target:
    entity:
      domain: media_player
      integration: relaytv
  fields:
    url:
      required: true
      example: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
      selector:
        text:
    use_ytdlp:
      required: false
      default: true
      selector:
        boolean:
    cec:
      required: false
      default: false
      selector:
        boolean:
    preserve_current:
      required: false
      selector:
        boolean:
    preserve_to:
      required: false
      selector:
        select:
          options:
            - next
            - end
    resume_current:
      required: false
      selector:
        boolean:
    playlist_mode:
      required: false
      selector:
        select:
          options:
            - auto
            - video
            - playlist

enqueue:
  name: Enqueue URL
  description: Add a URL or YouTube playlist to the RelayTV playback queue (POST /enqueue).
  target:
    entity:
      domain: media_player
      integration: relaytv
  fields:
    url:
      required: true
      example: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
      selector:
        text:
    position:
      required: false
      default: end
      selector:
        select:
          options:
            - end
            - next
    playlist_mode:
      required: false
      default: auto
      selector:
        select:
          options:
            - auto
            - video
            - playlist

clear_queue:
  name: Clear queue
  description: Clear the RelayTV playback queue (POST /clear).
  target:
    entity:
      domain: media_player
      integration: relaytv

announce:
  name: Announce
  description: Alias for play_now.
  target:
    entity:
      domain: media_player
      integration: relaytv
  fields:
    url:
      required: true
      example: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
      selector:
        text:
    use_ytdlp:
      required: false
      default: true
      selector:
        boolean:
    cec:
      required: false
      default: false
      selector:
        boolean:

play_temporary:
  name: Play temporary
  description: Temporarily interrupt playback and resume afterward (RelayTV POST /play_temporary).
  target:
    entity:
      domain: media_player
      integration: relaytv
  fields:
    url:
      required: true
      selector:
        text:
    timeout:
      required: false
      selector:
        number:
          min: 1
          max: 300
          mode: box
    volume:
      required: false
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
          mode: slider

cancel_temporary:
  name: Cancel temporary playback
  description: Abort an active temporary playback interruption and restore previous media (RelayTV POST /play_temporary/cancel).
  target:
    entity:
      domain: media_player
      integration: relaytv

jump_to_live:
  name: Jump to live
  description: Jump an active DVR-capable live stream back to the live edge (RelayTV POST /playback/live).
  target:
    entity:
      domain: media_player
      integration: relaytv

overlay:
  name: Overlay
  description: Display text/image overlay without interrupting playback (RelayTV POST /overlay).
  target:
    entity:
      domain: media_player
      integration: relaytv
  fields:
    text:
      required: false
      selector:
        text:
    duration:
      required: false
      selector:
        number:
          min: 1
          max: 120
          mode: box
    position:
      required: false
      selector:
        select:
          options:
            - top-left
            - top-right
            - top-center
            - bottom-left
            - bottom-right
    image_url:
      required: false
      selector:
        text:

play_synced:
  name: Play synced
  description: Start the same URL on multiple RelayTV entities at the same target timestamp.
  fields:
    url:
      required: true
      selector:
        text:
    target_entities:
      required: true
      selector:
        entity:
          multiple: true
          domain: media_player
          integration: relaytv
    delay_buffer_sec:
      required: false
      default: 2
      selector:
        number:
          min: 1
          max: 20
          mode: box

snapshot:
  name: Snapshot
  description: Capture a snapshot from RelayTV and expose snapshot_url on the entity. Active playback is required by the RelayTV server.
  target:
    entity:
      domain: media_player
      integration: relaytv

play_with_resume:
  name: Play with resume
  description: Play URL and resume from previously stored position when available.
  target:
    entity:
      domain: media_player
      integration: relaytv
  fields:
    url:
      required: true
      selector:
        text:
    use_ytdlp:
      required: false
      selector:
        boolean:
    cec:
      required: false
      selector:
        boolean:

upload_media:
  name: Upload media
  description: Upload a local Home Assistant media file to RelayTV using POST /ingest/media. This stores the file and returns a RelayTV media URL without playing or queueing it.
  target:
    entity:
      domain: media_player
      integration: relaytv
  fields:
    file:
      required: false
      selector:
        media:
          accept:
            - video/*
            - audio/*
    file_path:
      required: false
      example: "/config/www/clip.mp4"
      selector:
        text:
    title:
      required: false
      selector:
        text:

upload_media_play:
  name: Upload media and play
  description: Upload a local Home Assistant media file to RelayTV and start playback using POST /ingest/media/play.
  target:
    entity:
      domain: media_player
      integration: relaytv
  fields:
    file:
      required: false
      selector:
        media:
          accept:
            - video/*
            - audio/*
    file_path:
      required: false
      example: "/config/www/clip.mp4"
      selector:
        text:
    title:
      required: false
      selector:
        text:

upload_media_enqueue:
  name: Upload media and enqueue
  description: Upload a local Home Assistant media file to RelayTV and append it to the queue using POST /ingest/media/enqueue.
  target:
    entity:
      domain: media_player
      integration: relaytv
  fields:
    file:
      required: false
      selector:
        media:
          accept:
            - video/*
            - audio/*
    file_path:
      required: false
      example: "/config/www/clip.mp4"
      selector:
        text:
    title:
      required: false
      selector:
        text:
